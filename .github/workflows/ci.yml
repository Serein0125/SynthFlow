name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 离线冒烟测试（不联网、不花钱）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 唯一依赖是 monaco-editor。冒烟测试本身用不到它，
      # 但装上可以顺带验证 package-lock.json 是完整可还原的。
      - run: npm ci

      - name: 冒烟测试
        run: node scripts/smoke.mjs

      - name: 生产依赖应为 1 个（monaco-editor）
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          count=$(node -e "console.log(Object.keys(require('./package.json').dependencies||{}).length)")
          echo "直接依赖数：$count"
          test "$count" = "1"

  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 所有 JS/MJS 语法可解析
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --check "$f" || exit 1
          done
          echo "全部通过"
      - name: 后端不得引入第三方运行时依赖
        run: |
          if grep -rnE "from ['\"][^.'\"]" src/ | grep -vE "from ['\"]node:"; then
            echo "::error::src/ 里出现了非 Node 内置的 import"
            exit 1
          fi
          echo "零第三方依赖 ✓"
      - name: 仓库里不得出现 API Key
        run: |
          if git grep -nE "sk-[A-Za-z0-9]{16,}" -- . ':!*.md'; then
            echo "::error::疑似把 API Key 提交进来了"
            exit 1
          fi
          echo "未发现 Key ✓"
